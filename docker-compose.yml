services:
  bitsocial-previewer:
    image: ghcr.io/bitsocialnet/bitsocial-previewer:latest
    build:
      context: .
    container_name: bitsocial-previewer
    restart: unless-stopped

    # Host networking + BIND_HOST=127.0.0.1 keeps the preview port private to the
    # host, so only the local Caddy can proxy to it (never the public internet).
    network_mode: host

    environment:
      NODE_ENV: production
      PORT: "3924"
      BIND_HOST: 127.0.0.1
      DEBUG: bitsocial-previewer:*

      # Resolve shared comments through the box's pkc daemon over loopback RPC
      # (no auth key needed on 127.0.0.1). Public gateways answer 404/429 or time
      # out for current comment cids, so links fell back to generic cards. With
      # PKC_RPC_URLS set, pkc-js ignores IPFS_GATEWAY_URLS (no fallback); remove
      # PKC_RPC_URLS to go back to gateways.
      PKC_RPC_URLS: ws://127.0.0.1:9138
      IPFS_GATEWAY_URLS: https://gateway.forumindex.com,https://ipfsgateway.xyz,https://gateway.plebpubsub.xyz,https://ipfs.io
      GETCOMMENT_TIMEOUT_MS: "10000"

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
